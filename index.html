<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tagwerk</title>
<script src="sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#111113;--card:#161618;--card2:#1c1c1f;--line:#26262a;--ink:#ececee;--muted:#8a8a92;--dim:#5c5c63;--gold:#e6b65c;--teal:#3fc9a4;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:14px}
.logo{width:26px;height:26px;flex:none;color:var(--ink)}
.tabs{display:flex;gap:2px}
.tabs button{padding:6px 11px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--card2);color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.sync{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
.livepill{display:none;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;max-width:46vw}
.livepill.on{display:flex}
.livepill span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bnav{display:none}
@media (max-width:820px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;font-weight:500}
  .bnav button.on{color:var(--gold)}
  .bnav svg{width:21px;height:21px}
}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#3a3a40}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:#ff7a70}
.btn.armed{background:#c8413a;color:#fff;border-color:#c8413a}
.ic{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ic:hover{background:var(--card2);color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4a4a52}
textarea{resize:vertical;min-height:64px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pulse{animation:p 1.4s infinite}@keyframes p{50%{opacity:.3}}
/* add row */
.addrow{display:flex;align-items:center;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:4px 4px 4px 10px;background:var(--panel)}
.addrow input{border:0;background:transparent;padding:6px 0;flex:1;min-width:0}
.addrow select{width:auto;max-width:120px;padding:4px 24px 4px 8px;font-size:12px;background-color:var(--card2)}
.addrow .tb{font-size:11.5px;color:var(--muted);padding:4px 7px;border-radius:6px;background:var(--card2);white-space:nowrap}
.addrow .tb:hover{color:var(--ink)}
@media (max-width:620px){.tl2{display:none}.head .right{gap:4px}#pmonth{font-size:12.5px}}
#pmonth{white-space:nowrap}
/* task card */
.tcard{position:relative;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--qc,#555);border-radius:10px;padding:10px 12px 9px;margin-top:8px}
.tcard.run{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));border-left-color:var(--qc,#555);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 18%,transparent)}
.tcard.run::after{content:"";position:absolute;left:40%;right:40%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:sl 2.4s ease-in-out infinite}
@keyframes sl{0%{left:5%;right:75%}50%{left:60%;right:20%}100%{left:5%;right:75%}}
.tcard .tt{cursor:pointer;word-break:break-word}
.tcard.done{opacity:.5}.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid #4a4a52;display:grid;place-items:center;flex:none;color:transparent}
.chk:hover{border-color:var(--ink)}
.tcard.done .chk{background:var(--qc);border-color:var(--qc);color:#0b0b0c}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel);white-space:nowrap}
.ttime{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink)}
.play{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.play:hover{background:var(--card2);color:var(--ink)}
.rec{color:var(--dim);display:inline-flex}
.morebar{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:13px}
.morebar hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.secthead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.secthead:first-child{margin-top:0}
.banner{display:flex;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));background:color-mix(in srgb,var(--gold) 8%,var(--card));border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:13px}
.empty{color:var(--dim);font-size:13px;padding:14px 4px}
/* home grid */
.home{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.home{grid-template-columns:1fr}}
.today-stat{text-align:right}
.today-stat .big{font-size:22px;font-weight:600}.today-stat .big small{font-size:12px;color:var(--muted);font-weight:500;margin:0 2px}
.wbar{width:130px;height:4px;background:var(--line);border-radius:2px;margin:6px 0 3px auto;overflow:hidden}.wbar i{display:block;height:100%;background:var(--gold);border-radius:2px}
/* timeline */
.tl{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tlgrid{position:relative;display:grid}
.hrs{position:relative;border-right:1px solid var(--line)}
.hrs span{position:absolute;right:8px;font-size:11px;color:var(--dim);transform:translateY(-50%)}
.dcol{position:relative;border-right:1px solid var(--line)}
.dcol:last-child{border-right:0}
.hline{position:absolute;left:0;right:0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.blk{position:absolute;left:3px;right:3px;border-radius:5px;padding:1px 6px;font-size:11px;line-height:1.3;overflow:hidden;color:#f1eef8;border-left:2px solid var(--c);
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,transparent) 0 1.5px,color-mix(in srgb,var(--c) 16%,transparent) 1.5px 6px);cursor:pointer}
.blk small{display:block;color:color-mix(in srgb,#fff 55%,transparent);font-size:10px}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--gold);z-index:2}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.calhead{display:grid;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:3}
.calhead div{padding:10px 6px;text-align:center;font-size:13px;border-right:1px solid var(--line)}
.calhead div:last-child{border-right:0}
.calhead small{display:block;color:var(--dim);font-size:11px}
.calhead .td{color:var(--ink);background:color-mix(in srgb,var(--gold) 6%,transparent)}
.calscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.calin{min-width:740px}
@media (max-width:620px){.calin{min-width:0}.calin .hrs span{font-size:9px;right:3px}.calin .blk{left:1px;right:1px;padding:1px 2px;font-size:9px}.calin .blk small{display:none}.calin .calhead div{padding:8px 1px;font-size:11px}.calin .calhead small{font-size:9.5px}}
/* plan */
.cols{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.pcol{flex:0 0 260px;scroll-snap-align:start}
@media (max-width:620px){.pcol{flex:0 0 44vw}.pcol .tcard{padding:8px 9px}.pcol .chip{max-width:100%;overflow:hidden}.pcol .addrow input{font-size:13px}}
.pcol .dh{padding:4px 2px 8px;margin-bottom:8px;border-bottom:2px solid var(--line);font-weight:600}
.pcol .dh small{color:var(--muted);font-weight:500;margin-left:4px}
.pcol.today .dh{border-color:var(--gold)}.pcol.today .dh small{color:var(--gold)}
.pcol.past{opacity:.6}
/* focus */
.focus{position:fixed;inset:0;z-index:20;background:#070708;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(env(safe-area-inset-top) + 24px)}
.focus .fx{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px}
.focus .fl{position:absolute;top:calc(env(safe-area-inset-top) + 20px);right:20px;font-size:11px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:7px}
.focus h2{font-size:20px;font-weight:500;margin:18px 0 0;text-align:center;max-width:640px}
.ftime{font-size:min(26vw,128px);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:16px 0 4px}
.fstate{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.facts{display:flex;gap:10px;margin-top:26px}
.facts .btn{padding:10px 18px;font-size:15px}
.fnotes{margin-top:26px;width:min(560px,100%)}
.fnext{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);font-size:12px;color:var(--dim);display:flex;gap:12px;align-items:center}
/* quests */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.kpis>div{padding:16px 20px;border-right:1px solid var(--line)}.kpis>div:last-child{border-right:0}
.kpis .v{font-size:22px;font-weight:600;margin-top:6px}
@media (max-width:620px){.kpis{grid-template-columns:1fr}.kpis>div{border-right:0;border-bottom:1px solid var(--line)}.kpis>div:last-child{border-bottom:0}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel)}
.seg button{padding:5px 12px;border-radius:7px;color:var(--muted);font-size:13px}.seg button.on{background:var(--card2);color:var(--ink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.7}
.qcard .qi{width:34px;height:34px;border-radius:9px;background:var(--card2);display:grid;place-items:center;color:var(--c);flex:none}
.qcard .qh{display:flex;gap:12px}
.qcard .qd{color:var(--muted);font-size:12.5px;margin-top:2px}
.qcard .qb{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px;gap:10px}
.qcard .qv{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.qcard .qs{font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-top:6px}
.qnew{border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--muted);min-height:160px;text-align:center}
.qnew:hover{color:var(--ink);border-color:#3a3a40}
/* review */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rgrid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:820px){.rgrid,.rgrid2{grid-template-columns:1fr}}
.big2{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
.big2 small{font-size:13px;color:var(--muted);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:190px;align-items:end;margin-top:14px}
.bars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars i{display:block;width:min(30px,70%);border-radius:5px;background:#3c3c42;min-height:2px}
.bars .v{font-size:11px;color:var(--muted)}
.bars .d{font-size:11px;color:var(--dim)}
.bars .td i{background:var(--gold)}.bars .td .d,.bars .td .v{color:var(--gold)}
.hbq{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;margin-top:14px;font-size:13px}
.hbq .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.hbq .tr i{display:block;height:100%;border-radius:3px}
.qvo{height:34px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:16px}.qvo i{display:block;height:100%;background:var(--gold)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
/* search, filter, drag */
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;color:var(--muted);font-size:13px;min-width:220px}
.searchbtn kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--dim)}
@media (max-width:820px){.searchbtn{min-width:0;padding:7px;margin-left:auto}.searchbtn .st,.searchbtn kbd{display:none}.sync{margin-left:0}}
.sync{margin-left:0}
.sres{margin-top:10px;max-height:60vh;overflow:auto}
.sgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 4px 4px}
.sitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.sitem:hover,.sitem.sel{background:var(--card2)}
.sitem small{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.fbtn.on{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:999px;padding:2px 9px;margin-left:8px;cursor:pointer}
.sortlist{min-height:8px}
.plist{min-height:60px;padding-bottom:30px}
.tcard{cursor:grab;touch-action:pan-y}
.sghost{opacity:.35;border-style:dashed}
.schosen{box-shadow:0 8px 24px rgba(0,0,0,.5)}
.qcard.sghost{opacity:.35}
.hint2{font-size:12px;color:var(--dim)}
/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;padding:10px}
.modal.on{display:flex}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.sheet h3{margin:0;font-size:17px;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:var(--ink)}
.ipick{display:flex;gap:6px;flex-wrap:wrap}
.ipick button{width:36px;height:36px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.ipick button.on{color:var(--ink);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
</style>
</head>
<body>
<div class="top">
  <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M26 16a10 10 0 1 1-6.2-9.25"/><path d="M11.5 16.5l3.2 3.2 8.8-9.2"/></svg>
  <div class="tabs" id="tabs"></div>
  <button class="livepill" id="live" data-act="focus"><i class="dot pulse" style="background:var(--gold)"></i><span id="liveTxt"></span></button>
  <button class="searchbtn" data-act="search" aria-label="Suchen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="st">Suchen oder springen…</span><kbd>Strg K</kbd></button>
  <span class="sync" id="sync"></span>
</div>
<div class="wrap" id="view"></div>
<nav class="bnav" id="bnav"></nav>
<div id="focusLayer"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const monday=k=>{const d=parseD(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const STANDALONE=window.parent===window;
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MONS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const COLORS=['#a98bf0','#e98b5a','#9fd36b','#5cb8e6','#e6b65c','#e6739f','#3fc9a4'];
const wdi=k=>(parseD(k).getDay()+6)%7;
function hm(ms){const m=Math.round(Math.max(0,ms)/6e4),h=Math.floor(m/60);return h?`${h}h ${pad(m%60)}m`:`${m}m`}

/* ===== state ===== */
const LS='tagwerk.v1';
const blank=()=>({v:2,updatedAt:0,vision:'',yearGoal:'',quests:[],tasks:[],sessions:[],running:null,reviews:{},recurring:[],recSkip:{}});
let S=blank();
function normalize(o){const s=Object.assign(blank(),o||{});s.quests=(s.quests||[]).map(q=>Object.assign({desc:q.why||'',icon:'target',target:5,done:false},q));s.recurring=s.recurring||[];s.recSkip=s.recSkip||{};return s}
try{const raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw))}catch(e){}
const UI_LS=LS+'.ui';
let ui={view:'today',planWeek:monday(today()),calWeek:monday(today()),revWeek:monday(today()),qtab:'active',showDone:false,hideOther:false,newQ:'',filterQ:'',planHideDone:false};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UI_LS)||'{}'),{planWeek:monday(today()),calWeek:monday(today()),revWeek:monday(today())})}catch(e){}
if(ui.view==='focus')ui.view='today';
let focusOpen=false;
const saveUi=()=>{try{localStorage.setItem(UI_LS,JSON.stringify({view:ui.view,qtab:ui.qtab,showDone:ui.showDone,hideOther:ui.hideOther,newQ:ui.newQ,filterQ:ui.filterQ,planHideDone:ui.planHideDone}))}catch(e){}};

const quest=id=>S.quests.find(q=>q.id===id);
const qColor=id=>quest(id)?.color||'#6b6b73';
const task=id=>S.tasks.find(t=>t.id===id);
const isQT=t=>!!(t&&t.questId&&quest(t.questId));
const activeQuests=()=>S.quests.filter(q=>!q.done);
const weekTarget=()=>activeQuests().reduce((m,q)=>m+(+q.target||0),0);
function taskMs(id){let ms=0;for(const s of S.sessions)if(s.taskId===id)ms+=s.end-s.start;if(S.running&&S.running.taskId===id)ms+=Date.now()-S.running.start;return ms}
function allSessions(){const a=S.sessions.slice();if(S.running)a.push({id:'live',taskId:S.running.taskId,start:S.running.start,end:Date.now(),live:true});return a}
function sessIn(t0,t1){return allSessions().filter(s=>s.start<t1&&s.end>t0).map(s=>({...s,start:Math.max(s.start,t0),end:Math.min(s.end,t1)}))}
const dayStart=k=>parseD(k).getTime();
function questMsIn(t0,t1,qid){let ms=0;for(const s of sessIn(t0,t1)){const t=task(s.taskId);if(qid?t&&t.questId===qid:isQT(t))ms+=s.end-s.start}return ms}
function allMsIn(t0,t1){return sessIn(t0,t1).reduce((m,s)=>m+s.end-s.start,0)}
function dayTasks(k){return S.tasks.filter(t=>t.day===k).sort((a,b)=>a.order-b.order)}
function edgeOrder(k,top){const o=S.tasks.filter(t=>t.day===k).map(t=>t.order);if(!o.length)return 1;return top?Math.min(...o)-1:Math.max(...o)+1}

/* recurring */
function recMatches(r,k){if(k<r.start)return false;const w=wdi(k);if(r.freq==='daily')return true;if(r.freq==='weekdays')return w<5;if(r.freq==='weekly')return w===+r.dow;return false}
function ensureRec(keys){let ch=false;const t0=today();for(const k of keys){if(k<t0)continue;for(const r of S.recurring){if(!recMatches(r,k)||S.recSkip[r.id+'|'+k])continue;if(S.tasks.some(t=>t.recId===r.id&&t.day===k))continue;S.tasks.push({id:uid(),title:r.title,notes:'',questId:r.questId||null,day:k,order:edgeOrder(k,true),done:false,recId:r.id});ch=true}}if(ch)save(true)}

/* ===== persistence ===== */
let col=null,lastWritten={},writing=false,dirty=false,flushT=null;
function setSync(s){const m={local:STANDALONE?'Auf dem Gerät':'Nur lokal',loading:'Lädt…',saving:'Speichert…',synced:'Gespeichert',error:'Speicherfehler',readonly:'Nur lokal'};$('#sync').textContent=m[s]||''}
function save(quiet){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(flushT);flushT=setTimeout(flush,700)}
function buildDocs(){const docs={core:{v:2,updatedAt:S.updatedAt,vision:S.vision,yearGoal:S.yearGoal,quests:S.quests,reviews:S.reviews,running:S.running,recurring:S.recurring,recSkip:S.recSkip}};
  const m=k=>docs['m-'+k]||(docs['m-'+k]={tasks:[],sessions:[]});
  for(const t of S.tasks)m(t.day.slice(0,7)).tasks.push(t);for(const s of S.sessions)m(dkey(new Date(s.start)).slice(0,7)).sessions.push(s);return docs}
async function flush(){if(!col)return;if(writing){dirty=true;return}writing=true;setSync('saving');
  try{do{dirty=false;const docs=buildDocs();for(const[k,v]of Object.entries(docs)){const s=JSON.stringify(v);if(lastWritten[k]!==s){await col.doc(k).set(v);lastWritten[k]=s}}for(const k of Object.keys(lastWritten))if(!docs[k]){await col.doc(k).delete();delete lastWritten[k]}}while(dirty);setSync('synced')}
  catch(e){if(e&&e.code==='invalid_argument'){col=null;setSync('readonly')}else{setSync('error');if(e&&e.code==='quota_exceeded')toast('Speicher voll: alte Daten exportieren und löschen')}}writing=false}
async function getCap(name){for(let i=0;i<50&&!(window.claude&&window.claude.use);i++)await sleep(200);if(!(window.claude&&window.claude.use))return null;try{return await Promise.race([window.claude.use(name),sleep(10000).then(()=>null)])}catch(e){return null}}
async function initDb(){
  setSync('local');
  if(STANDALONE){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}return}
  setSync('loading');const db=await getCap('db');const user=db?await getCap('user'):null;let id=null;try{id=user?await user.id():null}catch(e){}
  if(!db||!id){setSync('local');return}
  try{col=db.collection('data/users/'+id);const snap=await Promise.race([col.get(),sleep(10000).then(()=>{throw{code:'timeout'}})]);
    const R=blank();let has=false;
    for(const d of snap.docs){if(!d.exists)continue;const b=d.data()||{};lastWritten[d.id]=JSON.stringify(b);has=true;
      if(d.id==='core'){for(const k of['updatedAt','vision','yearGoal','quests','reviews','running','recurring','recSkip'])if(b[k]!==undefined)R[k]=b[k]}
      else if(d.id.startsWith('m-')){R.tasks.push(...(b.tasks||[]));R.sessions.push(...(b.sessions||[]))}}
    if(has&&(R.updatedAt||0)>=(S.updatedAt||0)){S=normalize(JSON.parse(JSON.stringify(R)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render();setSync('synced')}
    else if(S.updatedAt)await flush();else setSync('synced');
  }catch(e){col=null;setSync('local')}
}

/* ===== timer ===== */
function stopRunning(){if(!S.running)return;const now=Date.now();if(now-S.running.start>=5000)S.sessions.push({id:uid(),taskId:S.running.taskId,start:S.running.start,end:now});S.running=null}
function startTask(id){if(S.running&&S.running.taskId===id)return;stopRunning();S.running={taskId:id,start:Date.now()};save()}
function toggleTask(id){if(S.running&&S.running.taskId===id){stopRunning()}else startTask(id);save();render()}
function completeTask(id){const t=task(id);if(!t)return;if(S.running&&S.running.taskId===id)stopRunning();t.done=true;t.doneAt=Date.now();save()}

/* ===== components ===== */
function questSelect(sel,id,cls=''){return `<select ${id?`id="${id}"`:''} class="${cls}" data-qsel>${'<option value="">Sonstiges</option>'+activeQuests().map(q=>`<option value="${q.id}" ${sel===q.id?'selected':''}>${esc(q.name||'Mission')}</option>`).join('')}</select>`}
function addRow(day,kind,ph){
  const qs=kind==='quest'?questSelect(ui.newQ&&quest(ui.newQ)&&!quest(ui.newQ).done?ui.newQ:(activeQuests()[0]?.id||'')):'';
  return `<form class="addrow" data-add="${day}" data-kind="${kind}"><input type="text" placeholder="${ph}" autocomplete="off" enterkeyhint="done">${qs}<button type="button" class="tb" data-act="addTop">${IC.up}<span class="tl2"> Oben</span></button><button type="submit" class="tb">${IC.down}<span class="tl2"> Unten</span></button></form>`}
function tcard(t,compact){
  const running=S.running&&S.running.taskId===t.id;const ms=taskMs(t.id);const q=quest(t.questId);
  return `<div class="tcard ${t.done?'done':''} ${running?'run':''}" data-tid="${t.id}" style="--qc:${qColor(t.questId)}">
    <div class="tt" data-act="edit" data-id="${t.id}">${esc(t.title)}</div>
    <div class="tmeta">
      <button class="chk" data-act="check" data-id="${t.id}" aria-label="Erledigt">${IC.check}</button>
      <span class="chip"><i class="dot" style="background:${qColor(t.questId)}"></i>${q?esc(q.name||'Mission'):'Sonstiges'}</span>
      ${ms||running?`<span class="ttime num">${running?'<i class="dot pulse" style="background:var(--gold)"></i>':''}<span data-live="${running?t.id:''}">${clock(ms)}</span></span>`:''}
      ${t.done?'':`<button class="play" data-act="toggle" data-id="${t.id}" aria-label="${running?'Pause':'Start'}">${running?IC.pause:IC.play}</button>`}
      ${t.recId?`<span class="rec" style="margin-left:auto" title="Wiederkehrend">${IC.rec}</span>`:''}${t.src==='mail'?`<span class="rec" style="margin-left:${t.recId?'4px':'auto'}" title="Aus E-Mail">${IC.mail}</span>`:''}
    </div></div>`}

function timeline(days,{px=44,head=false}={}){
  const t0=today();let h0=7,h1=24;
  for(const k of days)for(const s of sessIn(dayStart(k),dayStart(addDays(k,1)))){const h=new Date(s.start).getHours();if(h<h0)h0=h}
  const H=(h1-h0)*px;const narrow=innerWidth<620&&days.length>1;const cols=`${narrow?34:52}px repeat(${days.length},minmax(0,1fr))`;
  let out='';
  if(head){out+=`<div class="calhead" style="grid-template-columns:${cols}"><div></div>`;for(const k of days){const d=parseD(k);const tot=allMsIn(dayStart(k),dayStart(addDays(k,1)));out+=`<div class="${k===t0?'td':''}">${WD[wdi(k)]} <span class="dim">${d.getDate()}</span><small class="num">${hm(tot)}</small></div>`}out+='</div>'}
  out+=`<div class="tlgrid" style="grid-template-columns:${cols};height:${H}px"><div class="hrs">`;
  for(let h=h0+1;h<h1;h++)out+=`<span style="top:${(h-h0)*px}px">${pad(h)}:00</span>`;
  out+='</div>';
  for(const k of days){out+=`<div class="dcol" style="${k===t0&&days.length>1?'background:color-mix(in srgb,var(--gold) 3%,transparent)':''}">`;
    for(let h=h0+1;h<h1;h++)out+=`<div class="hline" style="top:${(h-h0)*px}px"></div>`;
    const base=dayStart(k)+h0*36e5;
    for(const s of sessIn(dayStart(k),dayStart(addDays(k,1)))){const t=task(s.taskId);const top=(s.start-base)/36e5*px,ht=Math.max(4,(s.end-s.start)/36e5*px);const c=t&&isQT(t)?qColor(t.questId):'#7c7c84';
      out+=`<div class="blk" style="--c:${c};top:${top}px;height:${ht}px" data-act="edit" data-id="${t?t.id:''}" title="${esc(t?t.title:'')} ${hhmm(s.start)}–${hhmm(s.end)}">${ht>=13?esc(t?t.title:'(gelöscht)'):''}${ht>=30?`<small class="num">${hhmm(s.start)} – ${s.live?'jetzt':hhmm(s.end)}</small>`:''}</div>`}
    if(k===t0){const n=new Date();const top=((n.getHours()-h0)*60+n.getMinutes())/60*px;if(top>0&&top<H)out+=`<div class="now" style="top:${top}px"></div>`}
    out+='</div>'}
  out+='</div>';
  return out;
}

function weekStat(){const wk=monday(today());const qms=questMsIn(dayStart(wk),dayStart(addDays(wk,7)));const tg=weekTarget();return{qms,tg}}

function vToday(){
  const k=today();ensureRec([k]);const d=parseD(k);
  const list=dayTasks(k);const qOpen=list.filter(t=>isQT(t)&&!t.done),qDone=list.filter(t=>isQT(t)&&t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const other=list.filter(t=>!isQT(t));const oOpen=other.filter(t=>!t.done),oDone=other.filter(t=>t.done);
  const todayMs=allMsIn(dayStart(k),dayStart(addDays(k,1)));const{qms,tg}=weekStat();
  const overdue=S.tasks.filter(t=>!t.done&&t.day<k);
  let h=`<div class="head"><h1>${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}</h1>
    <div class="right today-stat"><div><div class="big num">${hm(todayMs).replace(/(\d+)h /,'$1<small>h</small> ').replace(/m$/,'<small>m</small>')} <small>heute</small></div>
    <div class="wbar"><i style="width:${tg?Math.min(100,qms/(tg*36e5)*100):0}%"></i></div><div class="dim num" style="font-size:11px">${hm(qms)}${tg?` / ${tg}h`:''} Missionen diese Woche</div></div></div></div>`;
  if(overdue.length)h+=`<div class="banner"><span style="flex:1">${overdue.length} offene ${overdue.length===1?'Aufgabe':'Aufgaben'} aus Vortagen</span><button class="btn sm" data-act="pull">Auf heute holen</button></div>`;
  if(!S.quests.length)h+=`<div class="hint" style="margin-bottom:16px">Starte unter <b>Missionen</b>: Lege bis zu drei Ziele an. Alles, was keiner Mission dient, landet unten unter „Sonstiges“.</div>`;
  h+=`<div class="home"><div>
    <div class="secthead"><span class="lbl">Missions-Arbeit</span><span class="row" style="gap:2px"><button class="btn sm" data-act="mailOpen" title="Aufgabe aus E-Mail">${IC.mail}<span class="tl2"> Aus Mail</span></button>${filterBtn()}</span></div>
    ${addRow(k,'quest','Missions-Aufgabe hinzufügen…')}
    <div class="sortlist" data-list="today-q" data-day="${k}">${qOpen.filter(passF).map(t=>tcard(t)).join('')}</div>
    ${qOpen.filter(passF).length?'':'<div class="empty">Nichts offen. Was bringt deine Missionen heute voran?</div>'}
    ${qDone.length?`${(ui.showDone?qDone:qDone.slice(0,1)).map(t=>tcard(t)).join('')}${qDone.length>1||ui.showDone?`<div class="morebar"><hr><button data-act="showDone">${ui.showDone?'Einklappen ⌃':`Alle zeigen (${qDone.length}) ⌄`}</button></div>`:''}`:''}
    <div class="secthead"><span class="lbl">Sonstiges ${oOpen.length?`<span class="dim">· ${oOpen.length}</span>`:''}</span><button class="ic" data-act="hideOther" title="${ui.hideOther?'Einblenden':'Ausblenden'}">${ui.hideOther?IC.eyeoff:IC.eye}</button></div>

  </div><div><div class="secthead"><span class="lbl">Tatsächlich gearbeitet</span></div><div class="tl">${timeline([k])}</div></div></div>`;
  return h;
}

    <button class="btn sm" data-act="mailOpen" title="Aufgabe aus E-Mail">${IC.mail}<span class="tl2"> Aus Mail</span></button><button class="btn sm" data-act="recOpen">${IC.rec}<span class="tl2"> Wiederkehrend</span></button><button class="ic ${ui.planHideDone?'fbtn on':''}" data-act="planDone" title="${ui.planHideDone?'Erledigte zeigen':'Erledigte ausblenden'}">${ui.planHideDone?IC.eyeoff:IC.eye}</button></div></div>
    <div class="row" style="margin:-8px 0 14px;gap:10px;flex-wrap:wrap"><span class="muted" style="font-size:12.5px;white-space:nowrap">Neue Aufgaben für</span><div style="width:180px">${questSelect(ui.newQ||'','planQ')}</div><span class="hint2">Gedrückt halten und ziehen, um Aufgaben zu sortieren oder auf einen anderen Tag zu legen.</span></div>

    h+=`<div class="pcol ${k===t0?'today':''} ${k<t0?'past':''}" data-day="${k}" data-month="${d.getMonth()}" data-year="${d.getFullYear()}"><div class="dh">${WD[wdi(k)]} <small>${d.getDate()}.${d.getMonth()+1}.</small></div>
      <form class="addrow" data-add="${k}" data-kind="plan"><input type="text" placeholder="Aufgabe…" autocomplete="off" enterkeyhint="done"><button type="button" class="tb" data-act="addTop" title="Oben">${IC.up}</button><button type="submit" class="tb" title="Unten">${IC.down}</button></form>
      <div class="sortlist plist" data-list="plan" data-day="${k}">${open.map(t=>tcard(t)).join('')}${done.map(t=>tcard(t)).join('')}</div></div>`}
  h+='</div>';
  return h;
}

function vCal(){
  const wk=ui.calWeek;const days=[...Array(7)].map((_,i)=>addDays(wk,i));

    <div class="right today-stat"><div class="big num">${hm(qms)} <small>/ ${tg}h Missionen</small></div><div class="wbar"><i style="width:${tg?Math.min(100,qms/(tg*36e5)*100):0}%"></i></div></div></div>

function sparkline(vals,color,w=120,hgt=40){const mx=Math.max(1,...vals);const n=vals.length;const pts=vals.map((v,i)=>`${(i/(n-1||1)*(w-6)+3).toFixed(1)},${(hgt-4-v/mx*(hgt-10)).toFixed(1)}`);const last=pts[pts.length-1].split(',');
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`}
function weeklyQuest(qid,n){const wk=monday(today());return [...Array(n)].map((_,i)=>{const w=addDays(wk,-(n-1-i)*7);return questMsIn(dayStart(w),dayStart(addDays(w,7)),qid)/36e5})}
function vQuests(){

  <div class="kpis"><div><div class="muted" style="font-size:12px">Missions-Stunden gesamt</div><div class="v num">${hm(all)}</div></div><div><div class="muted" style="font-size:12px">Aktiv</div><div class="v num">${pad(act.length)}</div></div><div><div class="muted" style="font-size:12px">Abgeschlossen</div><div class="v num">${pad(done.length)}</div></div></div>
  <div class="row" style="margin-top:20px;justify-content:space-between;flex-wrap:wrap"><div class="seg"><button class="${ui.qtab!=='done'?'on':''}" data-act="qtab" data-t="active">Aktiv · ${act.length}</button><button class="${ui.qtab==='done'?'on':''}" data-act="qtab" data-t="done">Abgeschlossen · ${done.length}</button></div><span class="dim" style="font-size:12px">Antippen zum Bearbeiten oder Abschließen. Gedrückt halten und ziehen zum Sortieren.</span></div>
  <div class="qgrid" id="qgrid">`;

      <div class="qb"><div><div class="qv num">${hm(wms)}</div><div class="qs">DIESE WOCHE${q.target?` · ZIEL ${q.target}H`:''}</div></div><div style="text-align:right">${sparkline(weeklyQuest(q.id,8),q.color)}<div class="dim num" style="font-size:11px">${hm(tot)} gesamt</div></div></div></div>`}
  if(ui.qtab!=='done')h+=`<button class="qnew" data-act="qnew"><div><div style="font-size:22px">+</div>Neue Mission</div></button>`;
  else if(!done.length)h+=`<div class="empty">Noch keine Mission abgeschlossen.</div>`;
  h+=`</div>
  <div class="secthead" style="margin-top:34px"><span class="lbl">Kompass</span></div>
  <div class="card"><div class="dim" style="font-size:12.5px">Vertikale Kohärenz: Vision → Jahresziel → Missionen → Aufgaben → Stunden.</div>
    <label class="f">Vision: Was für ein Mensch willst du sein?</label><textarea data-field="vision" rows="2">${esc(S.vision)}</textarea>
    <label class="f">Jahresziel</label><textarea data-field="yearGoal" rows="2">${esc(S.yearGoal)}</textarea></div>
  <div class="secthead"><span class="lbl">Daten</span><span class="dim" style="font-size:12px">${col?'In deinem Konto gespeichert':STANDALONE?'Auf diesem Gerät gespeichert':'Nur in diesem Browser'}</span></div>
  <div class="row" style="flex-wrap:wrap">${STANDALONE?`<button class="btn sm" data-act="fileExport">Als Datei sichern</button><button class="btn sm" data-act="fileImport">Datei laden</button>`:''}<button class="btn sm" data-act="export">Text kopieren</button><button class="btn sm" data-act="importOpen">Text einfügen</button></div><input type="file" id="fileIn" accept="application/json,.json" hidden>`;
  return h;
}

function vReview(){
  const wk=ui.revWeek;const t0=dayStart(wk),t1=dayStart(addDays(wk,7));const tg=weekTarget();
  const qms=questMsIn(t0,t1),all=allMsIn(t0,t1);const curWk=monday(today());
  const daysElapsed=wk===curWk?wdi(today())+1:(wk>curWk?0:7);
  const per=[...Array(7)].map((_,i)=>{const k=addDays(wk,i);return{k,ms:questMsIn(dayStart(k),dayStart(addDays(k,1)))}});const mx=Math.max(36e5,...per.map(p=>p.ms));
  const byQ=S.quests.map(q=>({q,ms:questMsIn(t0,t1,q.id)})).filter(x=>x.ms>0||!x.q.done).sort((a,b)=>b.ms-a.ms);const mq=Math.max(1,...byQ.map(x=>x.ms));
  const N=8;const weeks=[...Array(N)].map((_,i)=>{const w=addDays(wk,-(N-1-i)*7);return{w,h:questMsIn(dayStart(w),dayStart(addDays(w,7)))/36e5}});
  const avg=weeks.map((x,i)=>{const s=weeks.slice(Math.max(0,i-3),i+1);return s.reduce((m,y)=>m+y.h,0)/s.length});
  const W=800,Hh=170,mh=Math.max(1,...weeks.map(x=>x.h),...avg);const bw=W/N;
  let svg=`<svg viewBox="0 0 ${W} ${Hh+22}" width="100%" style="display:block;margin-top:10px">`;
  weeks.forEach((x,i)=>{const bh=x.h/mh*(Hh-14);svg+=`<rect x="${i*bw+bw*.3}" y="${Hh-bh}" width="${bw*.4}" height="${Math.max(bh,1)}" rx="4" fill="${i===N-1?'var(--gold)':'var(--teal)'}"/><text x="${i*bw+bw/2}" y="${Hh+16}" text-anchor="middle" font-size="11" fill="#5c5c63">KW${isoW(x.w)}</text>`});
  svg+=`<polyline points="${avg.map((v,i)=>`${i*bw+bw/2},${Hh-v/mh*(Hh-14)}`).join(' ')}" fill="none" stroke="#e8e8ea" stroke-width="1.6"/>`;
  avg.forEach((v,i)=>{svg+=`<circle cx="${i*bw+bw/2}" cy="${Hh-v/mh*(Hh-14)}" r="3.5" fill="#0b0b0c" stroke="#e8e8ea" stroke-width="1.5"/>`});svg+='</svg>';
  const r=S.reviews[wk]||{};
  return `<div class="head"><div><h1>Wochen-Review</h1><div class="sub">Wie viel dieser Woche hat deine Missionen vorangebracht?</div></div>
    <div class="right"><button class="ic" data-act="rw" data-d="-7">${IC.l}</button><span class="num">${rng(wk)}</span><button class="ic" data-act="rw" data-d="7">${IC.r}</button><button class="btn sm" data-act="rwToday">${IC.cal2} Diese Woche</button></div></div>
  <div class="rgrid">
    <div class="card"><div class="lbl">Missions-Stunden</div><div class="big2 num" style="color:var(--gold)">${hm(qms)} <small>/ ${tg}h</small></div><div class="dim" style="font-size:12px;margin-top:4px">${tg?Math.round(qms/(tg*36e5)*100):0} % vom Ziel</div></div>
    <div class="card"><div class="lbl">Tagesdurchschnitt</div><div class="big2 num">${hm(daysElapsed?qms/daysElapsed:0)}</div><div class="dim" style="font-size:12px;margin-top:4px">Missions-Zeit pro Tag</div></div>
    <div class="card"><div class="lbl">Missionen vs. Sonstiges</div><div class="big2 num">${all?Math.round(qms/all*100):0} <small>%</small></div><div class="dim" style="font-size:12px;margin-top:4px">${hm(all)} gemessen gesamt</div></div>
  </div>
  <div class="rgrid2">
    <div class="card"><div class="lbl">Missions-Stunden pro Tag</div><div class="bars">${per.map(p=>`<div class="${p.k===today()?'td':''}"><span class="v num">${p.ms?hm(p.ms):'0m'}</span><i style="height:${p.ms/mx*140}px"></i><span class="d">${WD[wdi(p.k)]}</span></div>`).join('')}</div></div>
    <div style="display:grid;gap:14px">
      <div class="card"><div class="lbl">Stunden je Mission</div><div class="hbq">${byQ.map(x=>`<span class="row" style="gap:7px"><i class="dot" style="background:${x.q.color}"></i>${esc(x.q.name||'Mission')}</span><div class="tr"><i style="width:${x.ms/mq*100}%;background:${x.q.color}"></i></div><span class="num muted">${hm(x.ms)}${x.q.target?` / ${x.q.target}h`:''}</span>`).join('')||'<span class="dim">Noch keine Missionen.</span>'}</div></div>
      <div class="card"><div class="lbl">Missionen vs. Sonstiges</div><div class="qvo"><i style="width:${all?qms/all*100:0}%"></i></div><div class="legend"><span class="row" style="gap:6px"><i class="dot" style="background:var(--gold)"></i>Missionen · ${hm(qms)}</span><span class="row" style="gap:6px"><i class="dot" style="background:var(--line)"></i>Sonstiges · ${hm(all-qms)}</span></div></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="lbl">Missions-Stunden · letzte Wochen</div><div style="text-align:right"><div class="dim" style="font-size:11px">— Ø 4 Wochen</div><div class="num" style="font-size:22px;font-weight:600;color:var(--gold)">${hm(avg[N-1]*36e5)} <small class="muted" style="font-size:12px">/Woche</small></div></div></div>${svg}</div>
  <div class="secthead" style="margin-top:28px"><span class="lbl">Wochenreflexion</span></div>
  <div class="card">${[['good','Was ist gut gelaufen?'],['bad','Was ist schlecht gelaufen?'],['why','Warum?'],['improve','Was ändere ich systematisch nächste Woche?']].map(([f,l],i)=>`<label class="f" ${i?'':'style="margin-top:0"'}>${l}</label><textarea data-review="${f}" data-wk="${wk}" rows="2">${esc(r[f]||'')}</textarea>`).join('')}</div>`;
}
function isoW(k){const d=parseD(k);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

/* focus */
function focusQueue(){const k=today();return dayTasks(k).filter(t=>!t.done).sort((a,b)=>(isQT(a)?0:1)-(isQT(b)?0:1)||a.order-b.order)}
function focusCurrent(){let c=S.running?task(S.running.taskId):null;if(c&&!c.done)return c;return focusQueue()[0]||null}
function renderFocus(){
  const L=$('#focusLayer');if(!focusOpen){L.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';const cur=focusCurrent();
  if(!cur){L.innerHTML=`<div class="focus"><button class="ic fx" data-act="focusClose">${IC.back}</button><div style="font-size:44px;color:var(--gold)">✓</div><h2>Für heute ist alles erledigt</h2><p class="muted">Schau ins Logbuch oder plane morgen.</p><div class="facts"><button class="btn" data-act="focusClose">Zurück</button></div></div>`;return}
  const running=S.running&&S.running.taskId===cur.id;const q=quest(cur.questId);const rest=focusQueue().filter(t=>t.id!==cur.id).length;
  L.innerHTML=`<div class="focus"><button class="ic fx" data-act="focusClose" aria-label="Zurück">${IC.back}</button>
    <div class="fl"><i class="dot ${running?'pulse':''}" style="background:${running?'var(--gold)':'var(--dim)'}"></i>FOKUS · ${esc((q?q.name:'Sonstiges').toUpperCase())}</div>
    <span class="chip"><i class="dot" style="background:${qColor(cur.questId)}"></i>${q?esc(q.name):'Sonstiges'}</span>
    <h2>${esc(cur.title)}</h2>
    <div class="ftime num" data-live="${cur.id}" data-force="1">${clock(taskMs(cur.id))}</div>
    <div class="fstate">${running?'LÄUFT':'PAUSIERT'}</div>
    <div class="facts">${running?`<button class="btn" data-act="toggle" data-id="${cur.id}">${IC.pause} Pause</button>`:`<button class="btn gold" data-act="toggle" data-id="${cur.id}">${IC.play} ${taskMs(cur.id)?'Weiter':'Start'}</button>`}<button class="btn" data-act="fComplete" data-id="${cur.id}">${IC.check} Erledigt</button></div>
    <div class="fnotes">${ui.fNotes?`<textarea id="fnotes" data-id="${cur.id}" placeholder="Notizen…" rows="3">${esc(cur.notes||'')}</textarea>`:''}</div>
    <div class="fnext"><button data-act="fNotes">${ui.fNotes?'Notizen ausblenden':cur.notes?'Notizen anzeigen':'Notiz hinzufügen'}</button>${rest?`<span>·</span><button data-act="fSkip" data-id="${cur.id}">Später</button><span>·</span><span>noch ${rest} danach</span>`:''}</div></div>`;
}

function render(){
  renderNav();
  const fn={today:vToday,plan:vPlan,cal:vCal,quests:vQuests,review:vReview}[ui.view]||vToday;
  const ae=document.activeElement;let keep=null;
  if(ae&&ae.closest&&ae.closest('form[data-add]')){const f=ae.closest('form[data-add]');keep=[f.dataset.add,f.dataset.kind]}
  const sx=$('#cols')?.scrollLeft;
  $('#view').innerHTML=fn();
  if(keep){$(`form[data-add="${keep[0]}"][data-kind="${keep[1]}"] input`)?.focus()}
  if(ui.view==='plan'){const c=$('#cols');if(c){if(sx!=null&&ui._planKeep)c.scrollLeft=sx;else{const t=c.querySelector('.pcol.today');if(t)c.scrollLeft=t.offsetLeft-c.offsetLeft}c.addEventListener('scroll',planMonth,{passive:true});planMonth()}ui._planKeep=true}else ui._planKeep=false;
  initSort();
  renderFocus();tick();
}
function planMonth(){const c=$('#cols'),m=$('#pmonth');if(!c||!m)return;const cols=c.querySelectorAll('.pcol');for(const p of cols){if(p.offsetLeft-c.offsetLeft+p.offsetWidth/2>=c.scrollLeft){m.textContent=MON[+p.dataset.month]+' '+p.dataset.year;break}}}
let sorts=[];
function initSort(){sorts.forEach(s=>{try{s.destroy()}catch(e){}});sorts=[];if(!window.Sortable)return;
  document.querySelectorAll('.sortlist').forEach(el=>{const plan=el.dataset.list==='plan';
    sorts.push(Sortable.create(el,{group:plan?'plan':el.dataset.list,draggable:'.tcard',animation:160,delay:200,delayOnTouchOnly:true,touchStartThreshold:5,filter:'button,select,input,.chk,.play',preventOnFilter:false,ghostClass:'sghost',chosenClass:'schosen',scroll:true,bubbleScroll:true,forceAutoScrollFallback:true,scrollSensitivity:70,onEnd:applyOrder}))});
  const qg=$('#qgrid');if(qg)sorts.push(Sortable.create(qg,{draggable:'.qcard',animation:160,delay:200,delayOnTouchOnly:true,ghostClass:'sghost',onEnd:()=>{const ids=[...qg.querySelectorAll('.qcard')].map(e=>e.dataset.id);S.quests.sort((a,b)=>{const ia=ids.indexOf(a.id),ib=ids.indexOf(b.id);return(ia<0?1e9:ia)-(ib<0?1e9:ib)});save();render()}}))}
function applyOrder(ev){if(ev.from===ev.to&&ev.oldIndex===ev.newIndex)return;
  for(const c of new Set([ev.from,ev.to])){const k=c.dataset.day;[...c.querySelectorAll('.tcard')].forEach((el,i)=>{const t=task(el.dataset.tid);if(!t)return;if(t.day!==k){if(S.running&&S.running.taskId===t.id&&k!==today())stopRunning();t.day=k}t.order=i})}
  save();setTimeout(render,0)}
function tick(){
  const live=$('#live');if(S.running){const t=task(S.running.taskId);live.classList.add('on');$('#liveTxt').textContent=`${t?t.title:''} · ${clock(taskMs(S.running.taskId))}`}else live.classList.remove('on');
  document.querySelectorAll('[data-live]').forEach(el=>{const id=el.dataset.live;if(id&&(el.dataset.force||(S.running&&S.running.taskId===id)))el.textContent=clock(taskMs(id))});
}
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden&&!$('#modal').classList.contains('on')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))&&(ui.view==='today'||ui.view==='cal'))render()},60000);

/* ===== modal ===== */
function openModal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#sheet').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
function arm(btn,label){if(btn.classList.contains('armed'))return true;btn.classList.add('armed');const o=btn.innerHTML;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.innerHTML=o}},3000);return false}
function allQuestOptions(sel){return '<option value="">Sonstiges</option>'+S.quests.map(q=>`<option value="${q.id}" ${sel===q.id?'selected':''}>${esc(q.name||'Mission')}${q.done?' (abgeschlossen)':''}</option>`).join('')}
function editTask(id){const t=task(id);if(!t)return;
  openModal(`<h3>Aufgabe</h3>
  <label class="f">Titel</label><input type="text" id="eTitle" value="${esc(t.title)}">
  <label class="f">Mission</label><select id="eQuest">${allQuestOptions(t.questId||'')}</select>
  <label class="f">Tag</label><input type="date" id="eDay" value="${t.day}">
  <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-act="eday" data-d="${today()}">Heute</button><button class="btn sm" data-act="eday" data-d="${addDays(today(),1)}">Morgen</button><button class="btn sm" data-act="eday" data-d="${addDays(monday(today()),7)}">Nächster Montag</button></div>
  <label class="f">Position am Tag</label><div class="row" style="gap:6px"><button class="btn sm" data-act="eTop" data-id="${id}">${IC.up} Ganz nach oben</button><button class="btn sm" data-act="eBottom" data-id="${id}">${IC.down} Ganz nach unten</button></div>
  <label class="f">Notizen</label><textarea id="eNotes" rows="3">${esc(t.notes||'')}</textarea>
  <p class="dim" style="font-size:12px">Gemessen: ${hm(taskMs(id))}${t.recId?' · wiederkehrende Aufgabe':''}${t.done&&t.doneAt?` · erledigt ${hhmm(t.doneAt)}`:''}</p>
  <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn danger" data-act="tdel" data-id="${id}">Löschen</button><div class="row">${t.done?`<button class="btn" data-act="reopen" data-id="${id}">Wieder öffnen</button>`:''}<button class="btn gold" data-act="esave" data-id="${id}">Speichern</button></div></div>`)}
function editQuest(id){const q=id?quest(id):{name:'',desc:'',color:COLORS.find(c=>!S.quests.some(x=>x.color===c))||COLORS[0],icon:'target',target:5,done:false};
  openModal(`<h3>${id?'Mission bearbeiten':'Neue Mission'}</h3>
  <label class="f">Name</label><input type="text" id="qName" value="${esc(q.name)}" placeholder="z. B. Gesundheit, Projekt X, Umzug">
  <label class="f">Ziel / Beschreibung</label><input type="text" id="qDesc" value="${esc(q.desc||'')}" placeholder="z. B. Stabiler Launch bis Jahresende">
  <label class="f">Input-Ziel (Stunden pro Woche)</label><input type="number" id="qTarget" min="0" step="0.5" value="${q.target||''}">
  <label class="f">Symbol</label><div class="ipick" id="qIcon">${Object.keys(QI).map(k=>`<button type="button" data-act="pickIcon" data-k="${k}" class="${q.icon===k?'on':''}">${qicon(k)}</button>`).join('')}</div>
  <label class="f">Farbe</label><div class="sws" id="qColor">${COLORS.map(c=>`<button type="button" class="sw ${q.color===c?'on':''}" style="background:${c}" data-act="pickColor" data-c="${c}"></button>`).join('')}</div>
  <div class="row" style="justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:8px">${id?`<div class="row"><button class="btn danger" data-act="qdel" data-id="${id}">Löschen</button><button class="btn" data-act="qdone" data-id="${id}">${q.done?'Reaktivieren':'Abschließen'}</button></div>`:'<span></span>'}<div class="row"><button class="btn" data-act="close">Abbrechen</button><button class="btn gold" data-act="qsave" data-id="${id||''}">Speichern</button></div></div>`);
  modalQ={icon:q.icon,color:q.color}}
let modalQ={};
function recSheet(){
  const fl={daily:'Täglich',weekdays:'Werktags (Mo–Fr)',weekly:'Wöchentlich'};
  openModal(`<h3>Wiederkehrende Aufgaben</h3><p class="dim" style="font-size:12.5px;margin:6px 0 0">Werden automatisch ab heute in die passenden Tage eingeplant, z. B. „Morgen-Check-in“.</p>
  <div style="margin-top:12px">${S.recurring.map(r=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><i class="dot" style="background:${qColor(r.questId)}"></i><div style="flex:1"><div>${esc(r.title)}</div><div class="dim" style="font-size:12px">${fl[r.freq]}${r.freq==='weekly'?' am '+WD[r.dow]:''}</div></div><button class="btn sm danger" data-act="recDel" data-id="${r.id}">Entfernen</button></div>`).join('')||'<div class="empty">Noch keine.</div>'}</div>
  <label class="f">Neue Aufgabe</label><input type="text" id="rTitle" placeholder="z. B. Morgen-Check-in">
  <div class="row" style="margin-top:8px"><select id="rQuest">${allQuestOptions(activeQuests()[0]?.id||'')}</select><select id="rFreq"><option value="daily">Täglich</option><option value="weekdays">Werktags</option><option value="weekly">Wöchentlich</option></select><select id="rDow">${WD.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-act="close">Fertig</button><button class="btn gold" data-act="recAdd">Hinzufügen</button></div>`)}

/* ===== mail -> task ===== */
const PREFIX=/^\s*((re|aw|wg|fw|fwd|antw|weiterl)\s*:\s*)+/i;
function parseMail(title,text,url){
  text=(text||'').replace(/\r/g,'');let subject=(title||'').trim(),from='';
  const lines=text.split('\n');
  for(const l of lines.slice(0,40)){const m=l.match(/^\s*(betreff|subject)\s*:\s*(.+)$/i);if(m&&!subject){subject=m[2].trim()}const f=l.match(/^\s*(von|from)\s*:\s*(.+)$/i);if(f&&!from)from=f[2].trim()}
  if(!subject){const first=lines.map(x=>x.trim()).find(x=>x&&!/^(von|from|an|to|datum|date|gesendet|sent|cc)\s*:/i.test(x))||'';subject=first}
  subject=subject.replace(PREFIX,'').trim();if(subject.length>90)subject=subject.slice(0,87).trim()+'…';
  let notes=text.trim();if(url)notes+=(notes?'\n\n':'')+url;if(from&&!/^(von|from)\s*:/im.test(text))notes=`Von: ${from}\n`+notes;
  return{subject,notes}}
function mailSheet(title,text,url){const p=parseMail(title,text,url);const t0=today();
  openModal(`<h3>Aufgabe aus E-Mail</h3><p class="dim" style="font-size:12.5px;margin:6px 0 0">${text||title?'Aus dem geteilten Inhalt übernommen. Prüfen und speichern.':'Mailtext hier einfügen (gedrückt halten → Einfügen). Betreff und Absender werden erkannt.'}</p>
  <label class="f">Mailtext</label><textarea id="mText" rows="5" placeholder="Betreff: …&#10;Von: …&#10;&#10;Text der Mail">${esc(p.notes)}</textarea>
  <label class="f">Aufgabe</label><input type="text" id="mTitle" value="${esc(p.subject)}" placeholder="Was ist zu tun?">
  <label class="f">Mission</label><select id="mQuest">${allQuestOptions(ui.newQ&&quest(ui.newQ)?ui.newQ:'')}</select>
  <label class="f">Wann?</label><div class="seg" id="mDay"><button class="on" data-act="mDay" data-d="${t0}">Heute</button><button data-act="mDay" data-d="${addDays(t0,1)}">Morgen</button><button data-act="mDay" data-d="${addDays(monday(t0),7)}">Nächster Mo</button></div>
  <div class="row" style="justify-content:space-between;margin-top:18px;gap:8px;flex-wrap:wrap"><label class="row" style="gap:6px;font-size:13px;color:var(--muted)"><input type="checkbox" id="mTop" style="width:auto"> ganz oben einreihen</label><div class="row"><button class="btn" data-act="close">Abbrechen</button><button class="btn gold" data-act="mailSave">Als Aufgabe speichern</button></div></div>`);
  window.__mDay=t0;if(!p.subject)setTimeout(()=>$('#mText')?.focus(),50)}
function checkShare(){
  const q=new URLSearchParams(location.search);const title=q.get('title'),text=q.get('text'),url=q.get('url');
  if(!(title||text||url))return;try{history.replaceState(null,'',location.pathname)}catch(e){}
  mailSheet(title,text,url)}
/* ===== search ===== */
let sItems=[],sSel=0;
function openSearch(){openModal(`<div class="row"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="text" id="sq" placeholder="Aufgabe, Mission oder Ansicht…" autocomplete="off" style="border:0;background:transparent;padding:6px 0"></div><div class="sres" id="sres"></div>`);doSearch('');setTimeout(()=>$('#sq')?.focus(),30)}
function doSearch(q){q=q.trim().toLowerCase();const t0=today();sItems=[];
  const views=VIEWS.filter(v=>!q||v[1].toLowerCase().includes(q)).map(v=>({type:'view',id:v[0],label:v[1],sub:'Ansicht',icon:v[2]}));
  const qs=S.quests.filter(x=>!q||(x.name+' '+(x.desc||'')).toLowerCase().includes(q)).map(x=>({type:'quest',id:x.id,label:x.name||'Mission',sub:x.done?'abgeschlossen':'Mission',color:x.color}));
  const ts=S.tasks.filter(t=>q&&(t.title+' '+(t.notes||'')).toLowerCase().includes(q)).sort((a,b)=>(a.done-b.done)||Math.abs(parseD(a.day)-parseD(t0))-Math.abs(parseD(b.day)-parseD(t0))).slice(0,25)
    .map(t=>({type:'task',id:t.id,label:t.title,sub:(t.done?'✓ ':'')+(t.day===t0?'Heute':t.day===addDays(t0,1)?'Morgen':`${WD[wdi(t.day)]} ${parseD(t.day).getDate()}.${parseD(t.day).getMonth()+1}.`),color:qColor(t.questId)}));
  const groups=[['Aufgaben',ts],['Missionen',qs],['Springen zu',views]];let html='',i=0;
  for(const[g,arr]of groups){if(!arr.length)continue;html+=`<div class="sgrp">${g}</div>`;for(const it of arr){sItems.push(it);html+=`<button class="sitem ${i===0?'sel':''}" data-act="sgo" data-i="${i}">${it.icon?`<span style="width:18px;display:inline-grid">${it.icon}</span>`:`<i class="dot" style="background:${it.color}"></i>`}<span>${esc(it.label)}</span><small>${esc(it.sub)}</small></button>`;i++}}
  sSel=0;$('#sres').innerHTML=html||'<div class="empty">Nichts gefunden.</div>'}
function sGo(i){const it=sItems[i];if(!it)return;closeModal();
  if(it.type==='view'){if(it.id==='focus'){focusOpen=true;renderFocus()}else{ui.view=it.id;saveUi();render()}}
  else if(it.type==='quest'){ui.view='quests';ui.qtab=quest(it.id)?.done?'done':'active';saveUi();render();editQuest(it.id)}
  else{const t=task(it.id);if(t&&t.day===today()&&ui.view!=='today'){ui.view='today';render()}editTask(it.id)}}
function filterSheet(){openModal(`<h3>Filtern nach Mission</h3><div style="margin-top:10px">${[['','Alle Aufgaben','#8a8a92'],...activeQuests().map(q=>[q.id,q.name||'Mission',q.color]),['none','Sonstiges','#6b6b73']].map(([v,l,c])=>`<button class="sitem ${ui.filterQ===v?'sel':''}" data-act="setFilter" data-v="${v}"><i class="dot" style="background:${c}"></i><span>${esc(l)}</span>${ui.filterQ===v?'<small>✓</small>':''}</button>`).join('')}</div>`)}
/* ===== events ===== */
function addTask(form,top){const inp=form.querySelector('input');const title=inp.value.trim();if(!title)return;const k=form.dataset.add;const kind=form.dataset.kind;
  let qid=null;if(kind==='quest'){qid=form.querySelector('select')?.value||null;ui.newQ=qid||''}else if(kind==='plan'){qid=$('#planQ')?.value||null}
  S.tasks.push({id:uid(),title,notes:'',questId:qid,day:k,order:edgeOrder(k,top),done:false,created:Date.now()});inp.value='';save();saveUi();render()}
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-add]');if(!f)return;e.preventDefault();addTask(f,false)});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  switch(a){
  case 'go':if(el.dataset.view==='focus'){focusOpen=true;renderFocus();break}ui.view=el.dataset.view;saveUi();render();window.scrollTo(0,0);break;
  case 'focus':focusOpen=true;renderFocus();break;
  case 'search':openSearch();break;
  case 'mailOpen':mailSheet('','','');break;
  case 'mDay':window.__mDay=el.dataset.d;document.querySelectorAll('#mDay button').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'mailSave':{const ti=$('#mTitle').value.trim();if(!ti){$('#mTitle').focus();toast('Bitte eine Aufgabe eintragen');break}const d=window.__mDay||today();
    S.tasks.push({id:uid(),title:ti,notes:$('#mText').value.trim(),questId:$('#mQuest').value||null,day:d,order:edgeOrder(d,$('#mTop').checked),done:false,src:'mail',created:Date.now()});save();closeModal();render();toast(d===today()?'Aufgabe für heute angelegt':'Aufgabe eingeplant');break}
  case 'sgo':sGo(+el.dataset.i);break;
  case 'filter':filterSheet();break;
  case 'setFilter':ui.filterQ=el.dataset.v;saveUi();closeModal();render();break;
  case 'filterClear':ui.filterQ='';saveUi();render();break;
  case 'pscroll':{const c=$('#cols');const w=(c.querySelector('.pcol')?.offsetWidth||260)+14;c.scrollBy({left:+el.dataset.d*w*(innerWidth<620?1:3),behavior:'smooth'});break}
  case 'pToday':{const c=$('#cols'),t=c&&c.querySelector('.pcol.today');if(t)c.scrollTo({left:t.offsetLeft-c.offsetLeft,behavior:'smooth'});break}
  case 'planDone':ui.planHideDone=!ui.planHideDone;saveUi();render();break;
  case 'focusClose':focusOpen=false;render();break;
  case 'addTop':addTask(el.closest('form'),true);break;
  case 'check':{const t=task(id);if(t.done){t.done=false;delete t.doneAt}else completeTask(id);save();render();break}
  case 'toggle':toggleTask(id);break;
  case 'fComplete':completeTask(id);toast('Erledigt ✓');render();break;
  case 'fSkip':{const t=task(id);if(S.running&&S.running.taskId===id)stopRunning();t.order=edgeOrder(today(),false);save();render();break}
  case 'fNotes':ui.fNotes=!ui.fNotes;renderFocus();break;
  case 'showDone':ui.showDone=!ui.showDone;saveUi();render();break;
  case 'hideOther':ui.hideOther=!ui.hideOther;saveUi();render();break;
  case 'pull':{const k=today();for(const t of S.tasks.filter(x=>!x.done&&x.day<k)){t.order=edgeOrder(k,false);t.day=k}save();render();break}
  case 'pw':ui.planWeek=addDays(ui.planWeek,+el.dataset.d);ui._planKeep=false;render();$('#cols')&&($('#cols').scrollLeft=0);break;
  case 'pwToday':ui.planWeek=monday(today());ui._planKeep=false;render();break;
  case 'cw':ui.calWeek=addDays(ui.calWeek,+el.dataset.d);render();break;
  case 'cwToday':ui.calWeek=monday(today());render();break;
  case 'rw':ui.revWeek=addDays(ui.revWeek,+el.dataset.d);render();break;
  case 'rwToday':ui.revWeek=monday(today());render();break;
  case 'qtab':ui.qtab=el.dataset.t;saveUi();render();break;
  case 'edit':if(id)editTask(id);break;
  case 'eday':$('#eDay').value=el.dataset.d;break;
  case 'eTop':case 'eBottom':{const t=task(id);t.order=edgeOrder(t.day,a==='eTop');save();render();toast(a==='eTop'?'Nach oben verschoben':'Nach unten verschoben');break}
  case 'reopen':{const t=task(id);t.done=false;delete t.doneAt;save();closeModal();render();break}
  case 'esave':{const t=task(id);const ti=$('#eTitle').value.trim();if(ti)t.title=ti;t.questId=$('#eQuest').value||null;const d=$('#eDay').value;if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&d!==t.day){if(S.running&&S.running.taskId===id&&d!==today())stopRunning();t.day=d;t.order=edgeOrder(d,false)}t.notes=$('#eNotes').value;save();closeModal();render();break}
  case 'tdel':if(!arm(el,'Wirklich löschen?'))break;{const t=task(id);if(t&&t.recId)S.recSkip[t.recId+'|'+t.day]=1;S.tasks=S.tasks.filter(x=>x.id!==id);S.sessions=S.sessions.filter(s=>s.taskId!==id);if(S.running&&S.running.taskId===id)S.running=null;save();closeModal();render();break}
  case 'close':closeModal();break;
  case 'qnew':editQuest(null);break;
  case 'qedit':editQuest(id);break;
  case 'pickIcon':modalQ.icon=el.dataset.k;document.querySelectorAll('#qIcon button').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'pickColor':modalQ.color=el.dataset.c;document.querySelectorAll('#qColor button').forEach(b=>b.classList.toggle('on',b===el));break;
  case 'qsave':{const name=$('#qName').value.trim()||'Mission';const data={name,desc:$('#qDesc').value.trim(),target:parseFloat($('#qTarget').value)||0,icon:modalQ.icon,color:modalQ.color};
    if(id)Object.assign(quest(id),data);else S.quests.push(Object.assign({id:uid(),done:false,created:Date.now()},data));save();closeModal();render();break}
  case 'qdone':{const q=quest(id);q.done=!q.done;q.doneAt=q.done?Date.now():null;save();closeModal();render();toast(q.done?'Mission abgeschlossen 🎉':'Mission reaktiviert');break}
  case 'qdel':if(!arm(el,'Wirklich?'))break;S.quests=S.quests.filter(q=>q.id!==id);for(const t of S.tasks)if(t.questId===id)t.questId=null;for(const r of S.recurring)if(r.questId===id)r.questId=null;save();closeModal();render();break;
  case 'recOpen':recSheet();break;
  case 'recAdd':{const ti=$('#rTitle').value.trim();if(!ti){$('#rTitle').focus();break}S.recurring.push({id:uid(),title:ti,questId:$('#rQuest').value||null,freq:$('#rFreq').value,dow:+$('#rDow').value,start:today()});save();recSheet();render();break}
  case 'recDel':{S.recurring=S.recurring.filter(r=>r.id!==id);const k=today();S.tasks=S.tasks.filter(t=>!(t.recId===id&&!t.done&&t.day>=k&&!taskMs(t.id)));save();recSheet();render();break}
  case 'export':openModal(`<h3>Export</h3><p class="dim" style="font-size:12.5px">Text kopieren und sicher aufbewahren.</p><textarea id="exTxt" rows="8" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="close">Schließen</button><button class="btn gold" data-act="copy">Kopieren</button></div>`);break;
  case 'copy':{const v=$('#exTxt').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Kopiert')).catch(()=>{$('#exTxt').select();toast('Markiert, bitte manuell kopieren')});break}
  case 'importOpen':openModal(`<h3>Import</h3><p class="dim" style="font-size:12.5px">Exportierten Text einfügen. Ersetzt alle aktuellen Daten.</p><textarea id="imTxt" rows="8"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="close">Abbrechen</button><button class="btn danger" data-act="import">Importieren</button></div>`);break;
  case 'import':{let d;try{d=JSON.parse($('#imTxt').value)}catch(x){toast('Ungültiger Text');break}if(!d||!Array.isArray(d.tasks)){toast('Keine Tagwerk-Daten');break}if(!arm(el,'Alles ersetzen?'))break;S=normalize(d);save();closeModal();render();toast('Importiert');break}
  case 'fileExport':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='tagwerk-sicherung-'+today()+'.json';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},1000);toast('Sicherung gespeichert');break}
  case 'fileImport':$('#fileIn').click();break;
  case 'fileApply':S=normalize(window.__imp);save();closeModal();render();toast('Geladen');break;
  }
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='sq'){doSearch(el.value);return}
  if(el.id==='mText'){const ti=$('#mTitle');if(ti&&(!ti.value||ti.dataset.auto)){const p=parseMail('',el.value,'');ti.value=p.subject;ti.dataset.auto='1'}return}
  if(el.id==='mTitle'){delete el.dataset.auto;return}
  if(el.id==='fnotes'){const t=task(el.dataset.id);if(t){t.notes=el.value;save()}return}
  if(el.dataset.field){S[el.dataset.field]=el.value;save();return}
  if(el.dataset.review){const w=el.dataset.wk;S.reviews[w]=Object.assign({},S.reviews[w],{[el.dataset.review]:el.value});save()}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.id==='planQ'){ui.newQ=el.value;saveUi();return}
  if(el.closest&&el.closest('form[data-kind="quest"]')&&el.tagName==='SELECT'){ui.newQ=el.value;saveUi();return}
  if(el.id==='fileIn'&&el.files[0]){let d;try{d=JSON.parse(await el.files[0].text())}catch(x){toast('Datei ungültig');return}el.value='';if(!d||!Array.isArray(d.tasks)){toast('Keine Tagwerk-Sicherung');return}window.__imp=d;openModal(`<h3>Sicherung laden?</h3><p class="dim">Ersetzt alle aktuellen Daten (${d.tasks.length} Aufgaben in der Datei).</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Abbrechen</button><button class="btn danger" data-act="fileApply">Laden</button></div>`)}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
  if(e.target&&e.target.id==='sq'){const b=document.querySelectorAll('.sitem');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!b.length)return;sSel=(sSel+(e.key==='ArrowDown'?1:-1)+b.length)%b.length;b.forEach((x,i)=>x.classList.toggle('sel',i===sSel));b[sSel].scrollIntoView({block:'nearest'});return}if(e.key==='Enter'){e.preventDefault();sGo(sSel);return}}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')&&!$('#modal').classList.contains('on')){e.preventDefault();openSearch();return}
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(focusOpen){focusOpen=false;render()}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render()});
window.addEventListener('popstate',()=>{if(focusOpen){focusOpen=false;render()}});

render();initDb();checkShare();
if(STANDALONE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
